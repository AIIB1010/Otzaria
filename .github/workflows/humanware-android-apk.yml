name: HumanWare Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-humanware-apk

permissions:
  contents: read

jobs:
  build-android-7-apk:
    name: Build installable Android 7+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze the low vision edition
        run: flutter analyze lib/low_vision test/low_vision lib/app.dart

      - name: Run low vision tests
        run: flutter test test/low_vision

      - name: Build a release APK (Android 7+, 32/64-bit ARM)
        run: >
          flutter build apk --release
          --dart-define=LOW_VISION=true
          --target-platform android-arm,android-arm64

      - name: Upload installable APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Otzaria-HumanWare-Android7
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
