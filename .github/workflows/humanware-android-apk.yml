name: HumanWare Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-humanware-apk

permissions:
  contents: write

jobs:
  build-android-7-apk:
    name: Build installable Android 7+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      # שומר בין ריצות את קומפילציית ה-Rust של מנוע החיפוש ואת Gradle.
      # הריצה הראשונה אחרי שינוי תלויות איטית; הבאות מהירות בהרבה.
      - name: Cache Rust and Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .dart_tool/hooks_runner/shared
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lv-build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            lv-build-${{ runner.os }}-

      - name: Prepare the signing key file (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets. The APK is signed with a throw-away debug key, so it cannot update an installed copy."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/humanware-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/humanware-release.keystore" >> "$GITHUB_ENV"

      - name: Build a release APK (Android 7+, 32/64-bit ARM)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --dart-define=LOW_VISION=true
          --dart-define=LV_BUILD=${{ github.run_number }}
          --build-number=$((100000 + ${{ github.run_number }}))
          --target-platform android-arm,android-arm64

      - name: Upload installable APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Otzaria-HumanWare-Android7
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish as the latest in-app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk otzaria-humanware.apk
          gh release delete humanware-latest --yes --cleanup-tag || true
          gh release create humanware-latest otzaria-humanware.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "HumanWare build ${{ github.run_number }}" \
            --notes "build: ${{ github.run_number }}"
