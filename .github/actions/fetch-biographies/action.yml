name: Fetch biographies data
description: >
  Downloads biographies-app.json.gz from the latest release of
  Otzaria/toldot-gedolei-yisrael into assets/bio/, so it is packed into the
  app and ships with every installer. Best effort: on failure the build goes
  on without it, and the tool shows "no data" until the library update
  downloads it at runtime.

runs:
  using: composite
  steps:
    - name: Download biographies-app.json.gz
      shell: bash
      run: |
        mkdir -p assets/bio
        if curl -fsSL --retry 3 \
            -o assets/bio/biographies-app.json.gz.part \
            "https://github.com/Otzaria/toldot-gedolei-yisrael/releases/latest/download/biographies-app.json.gz"; then
          mv -f assets/bio/biographies-app.json.gz.part assets/bio/biographies-app.json.gz
          echo "Bundled biographies data ($(wc -c < assets/bio/biographies-app.json.gz) bytes)."
        else
          rm -f assets/bio/biographies-app.json.gz.part
          echo "::warning::Could not download biographies data; building without it."
        fi
