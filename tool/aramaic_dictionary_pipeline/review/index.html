<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בקרת מילון ארמי-עברי</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --ink:#1c2430; --mute:#667085; --accent:#2457c5; --ok:#1b7f4b; --warn:#b26a00; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2229; --line:#323a45; --ink:#e7ebf0; --mute:#9aa4b2; --accent:#7aa2ff; --ok:#4cc38a; --warn:#f5b04c; --bad:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0 0 0 12px; }
  .stat { color:var(--mute); font-size:13px; }
  .stat b { color:var(--ink); }
  select, input[type=text], textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  main { display:grid; grid-template-columns: 360px 1fr; height: calc(100vh - 58px); }
  #list { overflow:auto; border-inline-end:1px solid var(--line); background:var(--card); }
  .row { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:baseline; }
  .row:hover { background:rgba(120,140,200,.1); } .row.sel { background:rgba(36,87,197,.15); }
  .row .k { font-weight:600; min-width:90px; } .row .g { color:var(--mute); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; background:#aab; } .dot.decided { background:var(--ok); } .dot.agent { background:var(--warn); } .dot.pending { background:var(--bad); }
  #pane { overflow:auto; padding:16px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:14px; color:var(--mute); font-weight:600; }
  .key { font-size:28px; font-weight:700; margin:0 0 4px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--mute); margin-inline-end:6px; }
  .tag.warn { color:var(--warn); border-color:var(--warn); } .tag.bad { color:var(--bad); border-color:var(--bad); }
  .sense { padding:4px 0; border-bottom:1px dashed var(--line); } .sense:last-child { border:0; }
  .claim { padding:6px 0; border-bottom:1px dashed var(--line); } .claim:last-child { border:0; }
  .claim .g { font-size:18px; } .meta { color:var(--mute); font-size:12px; }
  a, .lnk { color:var(--accent); cursor:pointer; text-decoration:underline; }
  textarea { width:100%; min-height:90px; font-size:16px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .note { color:var(--warn); font-size:13px; }
  img.page { max-width:100%; border:1px solid var(--line); border-radius:6px; margin-top:6px; }
  .grp { border-inline-start:3px solid var(--accent); padding-inline-start:10px; margin-bottom:8px; }
  .toast { position:fixed; bottom:14px; inset-inline-start:14px; background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; }
  .toast.on { opacity:.95; }
</style>
</head>
<body>
<header>
  <h1>בקרת מילון ארמי-עברי</h1>
  <span class="stat" id="stats"></span>
  <select id="fStatus"><option value="">כל הסטטוסים</option><option value="pending">ממתין</option><option value="agent">הצעת סוכן</option><option value="decided">הוחלט</option></select>
  <select id="fKind"><option value="">כל הסוגים</option><option value="sense_cluster">קיבוץ פירושים</option><option value="wiktionary_candidate">ויקימילון</option></select>
  <select id="fClass"><option value="">כל הסיווגים</option></select>
  <select id="fSrc"><option value="">כל המקורות</option><option value="siftey_gitin">שפתי גיטין</option><option value="siftey_brachot">שפתי ברכות</option><option value="wiktionary">ויקימילון</option></select>
  <label class="stat"><input type="checkbox" id="fMod"> רק שינוי בפירוש קיים</label>
  <input type="text" id="fText" placeholder="חיפוש מילה/פירוש…" size="16">
  <button id="bulk" title="אשר הצעות סוכן שסומנו כביטחון גבוה וללא 'דורש אדם'">אשר בכמות הצעות סוכן…</button>
</header>
<main>
  <div id="list"></div>
  <div id="pane"><p class="meta">בחרו פריט מהרשימה. קיצורי מקלדת: J/K — הבא/הקודם, A — אשר הצעת סוכן, P — אשר הצעת מערכת, X — פסול, D — דורש בדיקה, U — חזרה להחלטה.</p></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, props={}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); for (const k of kids.flat()) e.append(k?.nodeType ? k : document.createTextNode(k ?? '')); return e; };
let queue = [], visible = [], current = null, currentItem = null, filtering = {};

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }

async function loadQueue(keep) {
  queue = await api('/api/queue');
  const classes = [...new Set(queue.flatMap(q => q.classes))].sort();
  const fc = $('#fClass'); const prev = fc.value;
  fc.replaceChildren(el('option', {value:'', textContent:'כל הסיווגים'}), ...classes.map(c => el('option', {value:c, textContent:c})));
  fc.value = prev;
  applyFilters(keep);
}

function applyFilters(keepId) {
  const st = $('#fStatus').value, kind = $('#fKind').value, cls = $('#fClass').value, src = $('#fSrc').value, txt = $('#fText').value.trim(), mod = $('#fMod').checked;
  visible = queue.filter(q => (!st || q.status === st) && (!kind || q.kind === kind) && (!cls || q.classes.includes(cls)) && (!src || q.sources.includes(src)) && (!mod || q.modifies_existing)
    && (!txt || q.key.includes(txt) || q.claims.flat().some(g => g.includes(txt))));
  const list = $('#list'); list.replaceChildren();
  for (const q of visible) {
    const row = el('div', {className: 'row' + (q.item_id === current ? ' sel' : '')}, el('span', {className: 'dot ' + q.status}), el('span', {className:'k', textContent: q.key}), el('span', {className:'g', textContent: q.claims.map(g => g[0]).join(' | ')}));
    row.onclick = () => openItem(q.item_id);
    row.dataset.id = q.item_id;
    list.append(row);
  }
  const c = s => queue.filter(q => q.status === s).length;
  $('#stats').innerHTML = `סה"כ <b>${queue.length}</b> · הוחלט <b>${c('decided')}</b> · הצעת סוכן <b>${c('agent')}</b> · ממתין <b>${c('pending')}</b> · מוצגים <b>${visible.length}</b>`;
}

function pageImg(rec) {
  return el('img', {className:'page', src: `/api/rec/${rec}.png`, loading:'lazy', alt:'עמוד מקור'});
}

function senseText(s) { return s.text ?? s; }

async function openItem(id) {
  current = id;
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  const data = await api('/api/item/' + id);
  currentItem = data;
  const it = data.item, p = it.system_proposal, pane = $('#pane');
  pane.replaceChildren();
  pane.append(el('div', {className:'card'},
    el('div', {className:'key', textContent: it.display_key}),
    el('div', {}, el('span', {className:'tag', textContent: it.kind === 'wiktionary_candidate' ? 'ויקימילון — חובה אישור אנושי' : 'קיבוץ פירושים'}),
      ...p.classes.map(c => el('span', {className:'tag', textContent:c})),
      el('span', {className:'tag', textContent:'ביטחון מערכת ' + p.confidence}),
      ...it.issues.map(i => el('span', {className:'tag warn', textContent:i})),
      p.modify_existing.length ? el('span', {className:'tag bad', textContent:'מציע שינוי בפירוש קיים!'}) : '')));

  if (it.existing_senses.length) pane.append(el('div', {className:'card'}, el('h3', {textContent:'פירושים קיימים באוצריא (מילון פשיטא) — לא יימחקו'}),
    ...it.existing_senses.map(s => el('div', {className:'sense'}, el('span', {textContent: s.raw}), el('span', {className:'meta', textContent: '  ' + s.sense_id})))));
  if (it.evidence_other_dictionaries.length) pane.append(el('details', {className:'card'}, el('summary', {textContent:`ראיות ממילונים אחרים בקובץ (${it.evidence_other_dictionaries.length}) — להצלבה בלבד`}),
    ...it.evidence_other_dictionaries.map(s => el('div', {className:'sense'}, `[${s.dictionary}] ${s.raw}`))));

  it.groups.forEach((g, gi) => {
    const card = el('div', {className:'card'}, el('h3', {textContent:`טענות ממקורות חדשים — קבוצה ${gi+1} (אותה קבוצת מילים נרדפות)`}));
    for (const c of g) {
      const occ = c.occurrences.map(o => o.permalink ? el('a', {href:o.permalink, target:'_blank', textContent:'דף ויקימילון (גרסה ' + o.revision_id + ')'}) :
        el('span', {className:'lnk', textContent:`${o.source === 'siftey_gitin' ? 'גיטין' : 'ברכות'} עמ' ${o.pdf_page} ${o.daf_label || ''}`, onclick: ev => { const h = ev.target.nextSibling; if (h && h.tagName === 'IMG') h.remove(); else ev.target.after(pageImg(o.record_id)); }}));
      card.append(el('div', {className:'claim'}, el('div', {className:'g', textContent: c.gloss}),
        el('div', {className:'meta', textContent: `מקורות: ${c.sources.join(', ')} · הופעות: ${c.attestations} · ביטחון חילוץ ${c.min_confidence}` + (c.issues.length ? ' · ' + c.issues.join(', ') : '')}),
        el('div', {className:'meta'}, ...occ.flatMap(x => [x, ' · ']))));
    }
    pane.append(card);
  });

  const proposalLines = [
    ...p.add_senses.map(s => '➕ משמעות: ' + s.text), ...p.support.map(s => '＝ תמיכה בפירוש קיים (' + s.relation + ')'),
    ...p.modify_existing.map(m => '✎ שינוי קיים: «' + m.old_text + '» ← «' + m.new_text + '»'), ...p.notes.map(n => 'ℹ ' + n)];
  pane.append(el('div', {className:'card'}, el('h3', {textContent:'הצעת מערכת (כללים דטרמיניסטיים)'}), ...proposalLines.map(l => el('div', {textContent: l}))));
  if (data.agent) {
    const a = data.agent;
    pane.append(el('div', {className:'card'}, el('h3', {textContent:'הצעת סוכן ה-AI (מסייעת, לא מכריעה)'}),
      el('div', {textContent: `פעולה: ${a.action} · סיווג: ${a.class || ''} · ביטחון: ${a.confidence ?? ''}` + (a.needs_human ? ' · דורש הכרעת אדם' : '')}),
      ...(a.add_senses || []).map(s => el('div', {textContent:'➕ ' + s.text})),
      ...(a.support || []).map(s => el('div', {textContent:'＝ תמיכה ב-' + s.target_sense_id})),
      ...(a.modify_existing || []).map(m => el('div', {textContent:'✎ «' + m.old_text + '» ← «' + m.new_text + '»'})),
      el('div', {className:'meta', textContent: a.rationale || ''})));
  }

  const basis = data.agent && data.agent.action === 'custom' ? data.agent.add_senses : p.add_senses;
  const ta = el('textarea', {id:'edit', value: (basis || []).map(s => s.text).join('\n')});
  const notes = el('input', {type:'text', id:'notes', placeholder:'הערות/סיבה (חובה בפסילה)', size:60, value: data.decision?.notes || ''});
  const supports = it.existing_senses.length ? el('div', {}, 'תמיכה בפירוש קיים (ללא הוספה): ', ...it.existing_senses.map(s => el('label', {}, el('input', {type:'checkbox', className:'sup', value:s.sense_id}), ' ' + s.text + '  ')) ) : '';
  const cls = el('select', {id:'cls'}, ...['distinct_sense','semantic_duplicate','exact_duplicate','grammatical_variant','orthographic_variant','conflicting_sources','uncertain'].map(c => el('option', {value:c, textContent:c, selected: c === (p.classes[0] || 'distinct_sense')})));
  const incMod = p.modify_existing.length ? el('label', {}, el('input', {type:'checkbox', id:'incMod'}), ' כלול את שינוי הפירוש הקיים המוצע') : '';
  pane.append(el('div', {className:'card'}, el('h3', {textContent: 'החלטה — משמעויות להוספה (שורה לכל משמעות; אפשר לערוך את הניסוח)'}), ta, supports, el('div', {}, 'סיווג: ', cls, ' ', incMod), notes,
    data.decision ? el('div', {className:'note', textContent: `החלטה נוכחית: ${data.decision.action} (${data.decision.reviewer}, ${data.decision.ts})`}) : '',
    el('div', {className:'actions'},
      el('button', {className:'ok', textContent:'שמור כפי שנערך (P=הצעת מערכת)', onclick: () => saveCustom()}),
      el('button', {textContent:'אשר הצעת מערכת', onclick: () => post({action:'accept_proposal'})}),
      data.agent ? el('button', {className:'primary', textContent:'אשר הצעת סוכן', onclick: () => acceptAgent()}) : '',
      el('button', {textContent:'כל קבוצה כמשמעות נפרדת', onclick: () => post({action:'custom', class:'distinct_sense', add_senses: it.groups.map(g => ({text: g.slice().sort((a,b)=> b.attestations-a.attestations)[0].gloss, claim_ids: g.map(c => c.claim_id)})), support:[], modify_existing:[]})}),
      el('button', {className:'bad', textContent:'פסול', onclick: () => { if (!$('#notes').value.trim()) return toast('נא לכתוב סיבת פסילה'); post({action:'reject'}); }}),
      el('button', {textContent:'דורש בדיקה נוספת', onclick: () => post({action:'defer'})}),
      el('button', {textContent:'חזרה להחלטה קודמת', onclick: () => post({action:'revert'})}))));
}

function allClaimIds() { return currentItem.item.groups.flat().map(c => c.claim_id); }

function saveCustom() {
  const it = currentItem.item, lines = $('#edit').value.split('\n').map(s => s.trim()).filter(Boolean);
  const support = [...document.querySelectorAll('.sup:checked')].map(c => ({target_sense_id: c.value, claim_ids: allClaimIds()}));
  const modify = $('#incMod')?.checked ? it.system_proposal.modify_existing : [];
  post({action:'custom', class: $('#cls').value, add_senses: lines.map(t => ({text:t, claim_ids: allClaimIds()})), support, modify_existing: modify});
}

function acceptAgent() {
  const a = currentItem.agent;
  if (a.action === 'accept_proposal') return post({action:'accept_proposal'});
  if (a.action === 'reject' || a.action === 'defer') return post({action: a.action});
  post({action:'custom', class: a.class, add_senses: a.add_senses || [], support: a.support || [], modify_existing: a.modify_existing || []});
}

async function post(body) {
  body.item_id = current; body.notes = $('#notes')?.value || body.notes || '';
  const r = await api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.error) return toast('שגיאה: ' + r.error);
  toast('נשמר'); const idx = visible.findIndex(q => q.item_id === current);
  await loadQueue(current);
  const next = visible[Math.min(idx + (body.action === 'revert' ? 0 : 0), visible.length - 1)];
  if (body.action !== 'revert') { const after = visible.find(q => q.item_id === current) ? visible[visible.findIndex(q => q.item_id === current) + 1] : visible[idx]; if (after) openItem(after.item_id); else if (next) openItem(next.item_id); }
  else openItem(current);
}

$('#bulk').onclick = async () => {
  const cands = queue.filter(q => q.status === 'agent' && q.kind !== 'wiktionary_candidate' && !q.agent_needs_human && (q.agent_confidence ?? 0) >= 0.85);
  if (!cands.length) return toast('אין הצעות מתאימות');
  if (!confirm(`לאשר בכמות ${cands.length} הצעות סוכן (ללא ויקימילון, ביטחון ≥ 0.85, לא מסומנות 'דורש אדם')? מומלץ קודם לדגום כמה בעין.`)) return;
  for (const q of cands) {
    const d = await api('/api/item/' + q.item_id); const a = d.agent;
    const body = {item_id: q.item_id, notes:'אישור בכמות של הצעת סוכן', reviewer:'human-bulk'};
    if (a.action === 'accept_proposal' || a.action === 'reject' || a.action === 'defer') body.action = a.action;
    else Object.assign(body, {action:'custom', class:a.class, add_senses:a.add_senses||[], support:a.support||[], modify_existing:a.modify_existing||[]});
    await api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  }
  toast('אושרו ' + cands.length); loadQueue(current);
};

for (const id of ['fStatus','fKind','fClass','fSrc','fMod']) $('#' + id).onchange = () => applyFilters();
$('#fText').oninput = () => applyFilters();
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  const idx = visible.findIndex(q => q.item_id === current);
  if (e.key === 'j') openItem(visible[Math.min(idx + 1, visible.length - 1)]?.item_id);
  if (e.key === 'k') openItem(visible[Math.max(idx - 1, 0)]?.item_id);
  if (e.key === 'a' && currentItem?.agent) acceptAgent();
  if (e.key === 'p') post({action:'accept_proposal'});
  if (e.key === 'd') post({action:'defer'});
  if (e.key === 'u') post({action:'revert'});
  if (e.key === 'x') { if (!$('#notes').value.trim()) { $('#notes').focus(); toast('כתבו סיבת פסילה ולחצו שוב X'); } else post({action:'reject'}); }
});
loadQueue();
</script>
</body>
</html>
