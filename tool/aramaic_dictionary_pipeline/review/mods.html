<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שינוי פירושים קיימים</title>
<style>
  :root { --bg:#f3f5f8; --card:#fff; --line:#d9dde3; --ink:#1c2430; --mute:#667085; --ok:#1b7f4b; --okbg:#e6f6ee; --bad:#b42318; --badbg:#fdecea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2229; --line:#323a45; --ink:#e7ebf0; --mute:#9aa4b2; --ok:#4cc38a; --okbg:#173326; --bad:#ff7b72; --badbg:#3a1d1b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif; font-size:16px; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; z-index:5; }
  header h1 { margin:0 0 4px; font-size:17px; } .meta { color:var(--mute); font-size:14px; }
  main { max-width:900px; margin:0 auto; padding:16px 16px 100px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; display:grid; grid-template-columns: 130px 1fr auto; gap:14px; align-items:center; }
  .key { font-size:24px; font-weight:700; }
  .old { color:var(--mute); text-decoration:line-through; } .new { font-size:19px; font-weight:600; background:var(--okbg); border-radius:6px; padding:2px 8px; display:inline-block; margin-top:4px; }
  .btns { display:flex; gap:8px; }
  button { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; background:var(--card); color:var(--ink); font-weight:600; }
  .ok { background:var(--ok); border-color:var(--ok); color:#fff; } .keep { border-color:var(--bad); color:var(--bad); }
  .row.done { opacity:.35; }
  .bulk { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>שינוי פירושים שכבר קיימים באוצריא</h1>
  <div class="meta">בכל שורה: הטקסט הקיים (מחוק) והטקסט המוצע (ירוק). <b>"עדכן"</b> = להחליף בקיים; <b>"השאר"</b> = לא לגעת בקיים (המילים המוצעות לא ייכנסו). <span id="cnt"></span></div>
  <div class="bulk"><button class="ok" id="allok">עדכן את כולם</button><button class="keep" id="allkeep">השאר את כולם כמו שהם</button></div>
</header>
<main id="main"></main>
<script>
const api = async (p, o) => (await fetch(p, o)).json();
let rows = [];
const post = (body) => api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});

async function decide(itemId, confirm) {
  const d = await api('/api/item/' + itemId);
  const dec = d.decision;
  const body = {item_id: itemId, action: dec.action, confirm_modify_existing: confirm, notes: confirm ? 'אושר עדכון פירוש קיים' : 'הפירוש הקיים נשאר ללא שינוי', reviewer: 'human:user'};
  if (dec.action === 'custom') Object.assign(body, {class: dec.class, add_senses: dec.add_senses || [], support: dec.support || [], modify_existing: dec.modify_existing || []});
  await post(body);
}

function render() {
  const main = document.getElementById('main'); main.replaceChildren();
  document.getElementById('cnt').textContent = `נותרו ${rows.length} לשיקול.`;
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'row';
    const key = Object.assign(document.createElement('div'), {className:'key', textContent:r.key});
    const txt = document.createElement('div');
    txt.append(Object.assign(document.createElement('div'), {className:'old', textContent:r.existing}), Object.assign(document.createElement('div'), {className:'new', textContent:r.new_text}));
    const btns = document.createElement('div'); btns.className = 'btns';
    const ok = Object.assign(document.createElement('button'), {className:'ok', textContent:'עדכן'});
    const keep = Object.assign(document.createElement('button'), {className:'keep', textContent:'השאר'});
    ok.onclick = async () => { row.classList.add('done'); await decide(r.item_id, true); load(); };
    keep.onclick = async () => { row.classList.add('done'); await decide(r.item_id, false); load(); };
    btns.append(ok, keep); row.append(key, txt, btns); main.append(row);
  }
  if (!rows.length) main.append(Object.assign(document.createElement('p'), {textContent:'🎉 אין עוד שינויים לשיקול.', className:'meta'}));
}
async function load() { rows = await api('/api/mods'); render(); }
async function all(confirm) {
  if (!confirm_(`${confirm ? 'לעדכן' : 'להשאיר ללא שינוי'} את כל ${rows.length} הפריטים?`)) return;
  for (const id of [...new Set(rows.map(r => r.item_id))]) await decide(id, confirm);
  load();
}
const confirm_ = (m) => window.confirm(m);
document.getElementById('allok').onclick = () => all(true);
document.getElementById('allkeep').onclick = () => all(false);
load();
</script>
</body>
</html>
