<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בקרת מילון ארמי — מצב פשוט</title>
<style>
  :root { --bg:#f3f5f8; --card:#fff; --line:#d9dde3; --ink:#1c2430; --mute:#667085; --ok:#1b7f4b; --okbg:#e6f6ee; --bad:#b42318; --badbg:#fdecea; --warn:#b26a00; --warnbg:#fff4e0; --accent:#2457c5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2229; --line:#323a45; --ink:#e7ebf0; --mute:#9aa4b2; --ok:#4cc38a; --okbg:#173326; --bad:#ff7b72; --badbg:#3a1d1b; --warn:#f5b04c; --warnbg:#3a2e14; --accent:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif; font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .bar { flex:1; min-width:160px; height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--ok); width:0; transition:width .3s; }
  .stat { color:var(--mute); font-size:14px; }
  select, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  main { max-width:920px; margin:0 auto; padding:16px 16px 140px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--mute); font-weight:600; }
  .word { font-size:44px; font-weight:700; margin:0; line-height:1.2; }
  .tags { margin-top:6px; }
  .tag { display:inline-block; font-size:12px; padding:2px 9px; border-radius:10px; border:1px solid var(--line); color:var(--mute); margin-inline-end:6px; }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .existing { background:var(--card); }
  .exline { font-size:19px; padding:4px 0; border-bottom:1px dashed var(--line); } .exline:last-child { border:0; }
  .newbox { background:var(--okbg); border-color:var(--ok); }
  .newbox .line { font-size:24px; font-weight:600; padding:4px 0; }
  .nobox { background:var(--badbg); border-color:var(--bad); }
  .modbox { background:var(--warnbg); border-color:var(--warn); }
  .meta { color:var(--mute); font-size:13px; }
  .claim { padding:6px 0; border-bottom:1px dashed var(--line); } .claim:last-child { border:0; }
  .claim .g { font-size:18px; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:10px; margin-top:8px; }
  .imgs figure { margin:0; } .imgs img { width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .imgs figcaption { font-size:12px; color:var(--mute); margin-top:2px; }
  .why { font-size:14px; color:var(--mute); }
  .footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .footer button { font-size:19px; padding:12px 26px; border-radius:10px; font-weight:600; }
  .b-ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .b-bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  .b-alt { border-color:var(--accent); color:var(--accent); }
  .help { text-align:center; color:var(--mute); font-size:12px; width:100%; }
  .done { text-align:center; padding:60px 0; font-size:22px; }
  textarea { width:100%; min-height:70px; font:inherit; font-size:18px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px; }
  .toast { position:fixed; top:70px; inset-inline-start:14px; background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; z-index:9; } .toast.on { opacity:.95; }
</style>
</head>
<body>
<header>
  <h1>בקרת מילון ארמי</h1>
  <div class="bar"><div id="barfill"></div></div>
  <span class="stat" id="stats"></span>
  <select id="seg">
    <option value="safe">הצעות בטוחות (הסוכן לא ביקש אדם)</option>
    <option value="human">דורשים בדיקה מיוחדת</option>
    <option value="reject">הסוכן מציע לא להוסיף</option>
    <option value="all">הכול</option>
  </select>
  <button id="bulk" title="מאשר את כל הפריטים הנותרים בקבוצה 'בטוחות' בבת אחת">אשר את כל הבטוחות…</button>
</header>
<main id="main"></main>
<div class="footer" id="footer"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, props={}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); for (const k of kids.flat()) e.append(k?.nodeType ? k : document.createTextNode(k ?? '')); return e; };
const api = async (p, o) => (await fetch(p, o)).json();
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1500); };

let queue = [], list = [], pos = 0, data = null, history = [];

const inSeg = (q, seg) => {
  if (seg === 'all') return true;
  if (seg === 'reject') return q.agent_action === 'reject';
  if (seg === 'human') return q.agent_needs_human || q.agent_action === 'defer';
  return !q.agent_needs_human && q.agent_action !== 'reject' && q.agent_action !== 'defer';
};

async function load(keepId) {
  queue = await api('/api/queue');
  const seg = $('#seg').value;
  list = queue.filter(q => q.status !== 'decided' && inSeg(q, seg));
  const total = queue.length, decided = queue.filter(q => q.status === 'decided').length;
  $('#barfill').style.width = (100 * decided / total) + '%';
  $('#stats').textContent = `הוחלט ${decided} מתוך ${total} · נותרו בקבוצה זו ${list.length}`;
  pos = keepId ? Math.max(0, list.findIndex(q => q.item_id === keepId)) : 0;
  await show();
}

// מה ייכנס למילון לפי הצעה (סוכן או מערכת)
function effective(it, agent) {
  const p = it.system_proposal;
  const src = agent && agent.action === 'custom' ? agent : p;
  const rejectSuggested = agent && agent.action === 'reject';
  return {
    adds: rejectSuggested ? [] : (src.add_senses || []).map(s => s.text),
    supports: rejectSuggested ? 0 : (src.support || []).length,
    mods: rejectSuggested ? [] : (src.modify_existing || []),
    rejectSuggested,
  };
}

function approveBody(it, agent) {
  if (!agent || agent.action === 'defer' || agent.action === 'accept_proposal') return {action:'accept_proposal'};
  if (agent.action === 'reject') return {action:'reject'};
  return {action:'custom', class: agent.class, add_senses: agent.add_senses || [], support: agent.support || [], modify_existing: agent.modify_existing || []};
}

function pageImg(rec, cap) {
  return el('figure', {}, el('img', {src:`/api/rec/${rec}.png`, loading:'lazy', alt:'עמוד מקור'}), el('figcaption', {textContent: cap}));
}

async function show() {
  const main = $('#main'), footer = $('#footer');
  main.replaceChildren(); footer.replaceChildren();
  if (pos >= list.length) {
    main.append(el('div', {className:'done'}, list.length ? 'סוף הרשימה' : '🎉 אין עוד פריטים בקבוצה הזו', el('div', {className:'meta', textContent:'אפשר לעבור לקבוצה אחרת בתפריט למעלה.'})));
    return;
  }
  const id = list[pos].item_id;
  data = await api('/api/item/' + id);
  const it = data.item, agent = data.agent, p = it.system_proposal, eff = effective(it, agent);

  main.append(el('div', {className:'card'},
    el('div', {className:'meta', textContent:`פריט ${pos + 1} מתוך ${list.length} בקבוצה`}),
    el('h2', {className:'word', textContent: it.display_key}),
    el('div', {className:'tags'}, ...it.issues.map(i => el('span', {className:'tag warn', textContent:i})), agent?.needs_human ? el('span', {className:'tag warn', textContent:'הסוכן ביקש הכרעת אדם'}) : '')));

  if (it.existing_senses.length)
    main.append(el('div', {className:'card existing'}, el('h3', {textContent:'מה כבר כתוב היום באוצריא (לא ייגע בו)'}),
      ...it.existing_senses.map(s => el('div', {className:'exline', textContent: s.raw}))));
  else main.append(el('div', {className:'card'}, el('div', {className:'meta', textContent:'המילה הזו עדיין לא קיימת במילון.'})));

  if (eff.rejectSuggested)
    main.append(el('div', {className:'card nobox'}, el('h3', {textContent:'הצעת הסוכן'}), el('div', {style:'font-size:20px;font-weight:600', textContent:'לא להוסיף כלום מהפריט הזה'})));
  else if (eff.adds.length)
    main.append(el('div', {className:'card newbox', id:'newbox'}, el('h3', {textContent:'מה יתווסף למילון אם תאשר (אפשר לערוך את הנוסח למטה)'}),
      ...eff.adds.map(t => el('div', {className:'line', textContent:'➕ ' + t}))));
  else
    main.append(el('div', {className:'card'}, el('div', {textContent:'לא יתווסף טקסט חדש — הטענות החדשות זהות לקיים ויתועדו כתמיכה בלבד.'})));

  if (eff.mods.length)
    main.append(el('div', {className:'card modbox'}, el('h3', {textContent:'⚠ ההצעה כוללת שינוי של פירוש קיים'}), ...eff.mods.map(m => el('div', {textContent:`«${m.old_text}» ← «${m.new_text}»`}))));

  if (agent?.rationale) main.append(el('div', {className:'card'}, el('h3', {textContent:`הסבר הסוכן (${agent.action}, ביטחון ${agent.confidence ?? ''})`}), el('div', {className:'why', textContent: agent.rationale})));

  // מקור
  const claims = it.groups.flat();
  main.append(el('div', {className:'card'}, el('h3', {textContent:'מה כתוב בספרים המקוריים'}),
    ...claims.map(c => el('div', {className:'claim'}, el('div', {className:'g', textContent: c.gloss}),
      el('div', {className:'meta', textContent:`${c.sources.map(s => s === 'siftey_gitin' ? 'שפתי גיטין' : s === 'siftey_brachot' ? 'שפתי ברכות' : s).join(', ')} · הופעות: ${c.attestations}`}))),
    el('div', {className:'imgs'}, ...claims.slice(0, 4).flatMap(c => c.occurrences.slice(0, 1).filter(o => o.pdf_page).map(o => pageImg(o.record_id, `${o.source === 'siftey_gitin' ? 'גיטין' : 'ברכות'} עמ' ${o.pdf_page} ${o.daf_label || ''}`))))));

  main.append(el('div', {className:'card'}, el('h3', {textContent:'רוצה לשנות את הנוסח? ערוך כאן (שורה לכל משמעות) ולחץ "אשר עם עריכה"'}),
    el('textarea', {id:'edit', value: eff.adds.join('\n')})));

  // כפתורים
  const approveLabel = eff.rejectSuggested ? '✔ מסכים: לא להוסיף' : '✔ אשר';
  footer.append(
    el('button', {className:'b-ok', textContent: approveLabel, onclick: () => decide(approveBody(it, agent), 'אושר')}),
    eff.rejectSuggested
      ? el('button', {className:'b-alt', textContent:'➕ להוסיף בכל זאת', onclick: () => decide({action:'accept_proposal'}, 'אושר')})
      : el('button', {className:'b-bad', textContent:'✘ פסול (לא להוסיף)', onclick: () => decide({action:'reject'}, 'נפסל')}),
    eff.adds.length && !eff.rejectSuggested ? el('button', {className:'b-alt', textContent:'✎ אשר עם עריכה', onclick: () => decide(editedBody(it), 'נשמר')}) : '',
    el('button', {textContent:'דלג', onclick: () => { pos++; show(); }}),
    el('button', {textContent:'↶ בטל קודם', onclick: undo}),
    el('div', {className:'help', textContent:'קיצורים: Enter=אשר · X=פסול · S=דלג · Z=בטל'}));
  window.scrollTo(0, 0);
  // טעינה מוקדמת של הפריט הבא
  if (list[pos + 1]) api('/api/item/' + list[pos + 1].item_id).then(d => d.item.groups.flat().slice(0, 4).forEach(c => c.occurrences.slice(0, 1).forEach(o => { new Image().src = `/api/rec/${o.record_id}.png`; })));
}

function editedBody(it) {
  const lines = $('#edit').value.split('\n').map(s => s.trim()).filter(Boolean);
  const ids = it.groups.flat().map(c => c.claim_id);
  const a = data.agent, p = it.system_proposal, src = a && a.action === 'custom' ? a : p;
  return {action:'custom', class: (a?.class || p.classes[0] || 'distinct_sense'), add_senses: lines.map(t => ({text:t, claim_ids: ids})), support: src.support || [], modify_existing: src.modify_existing || []};
}

let busy = false;
async function decide(body, label) {
  if (busy) return;  // מונע אישור כפול כשמחזיקים Enter
  busy = true;
  try { await decideNow(body, label); } finally { busy = false; }
}

async function decideNow(body, label) {
  const id = list[pos].item_id;
  body.item_id = id;
  body.notes = body.action === 'reject' ? 'נפסל בבקרה ידנית (מצב פשוט)' : 'אושר בבקרה ידנית (מצב פשוט)';
  body.reviewer = 'human:user';
  const r = await api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.error) return toast('שגיאה: ' + r.error);
  history.push(id);
  toast(label);
  const next = list[pos + 1]?.item_id;
  await load(next);
}

async function undo() {
  const id = history.pop();
  if (!id) return toast('אין מה לבטל');
  await api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({item_id:id, action:'revert', reviewer:'human:user'})});
  toast('בוטל');
  const seg = $('#seg').value; $('#seg').value = 'all';
  await load(id); $('#seg').value = seg;
}

$('#seg').onchange = () => load();
$('#bulk').onclick = async () => {
  const cands = queue.filter(q => q.status === 'agent' && inSeg(q, 'safe') && (q.agent_confidence ?? 0) >= 0.85);
  if (!cands.length) return toast('אין פריטים מתאימים');
  if (!confirm(`לאשר בבת אחת ${cands.length} פריטים (הצעות בטוחות בביטחון ≥ 0.85)?\nמומלץ קודם לעבור ידנית על כ-30 פריטים כדי לוודא שההצעות טובות.`)) return;
  for (const q of cands) {
    const d = await api('/api/item/' + q.item_id);
    await api('/api/decision', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...approveBody(d.item, d.agent), item_id:q.item_id, notes:'אישור בכמות (מצב פשוט)', reviewer:'human-bulk'})});
  }
  toast('אושרו ' + cands.length); load();
};

document.addEventListener('keydown', e => {
  if (['TEXTAREA', 'INPUT', 'SELECT', 'BUTTON'].includes(document.activeElement.tagName)) return;
  if (e.key === 'Enter') $('.b-ok')?.click();
  if (e.key === 'x' || e.key === 'X' || e.key === 'ס') $('.b-bad')?.click();
  if (e.key === 's' || e.key === 'S' || e.key === 'ד') { pos++; show(); }
  if (e.key === 'z' || e.key === 'Z') undo();
});

load();
</script>
</body>
</html>
